name: Ernie
options:
  bundleIdPrefix: com.websdbm
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    # Team Apple di Alessandro (firma automatica); le build per simulatore non lo richiedono.
    DEVELOPMENT_TEAM: 76X78MBPR3
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  Ernie:
    type: application
    platform: iOS
    sources:
      - path: Ernie
      - path: Shared
    dependencies:
      - target: ErnieWidgets
        embed: true
      - target: ErnieShare
        embed: true
      - target: ErnieNotifications
        embed: true
    info:
      path: Ernie/Info.plist
      properties:
        CFBundleDisplayName: Ernie
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: it
        CFBundleLocalizations: [it]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSMicrophoneUsageDescription: "Ernie ascolta la tua voce quando tocchi il microfono; nella conversazione continua resta in ascolto finché non chiudi."
        NSSpeechRecognitionUsageDescription: "La trascrizione avviene sul dispositivo; al tuo server Ernie arriva solo il testo."
        NSFaceIDUsageDescription: "Conferma delle azioni sensibili: approvazioni e interruttore di emergenza."
        NSCameraUsageDescription: "Per scansionare documenti (il testo viene letto sul telefono, l'immagine non viene conservata) e per scattare le foto da mandare ai familiari."
        NSPhotoLibraryAddUsageDescription: "Per salvare nella galleria gli schemi e i riassunti che esporti."
        NSLocationWhenInUseUsageDescription: "Ernie usa la tua posizione approssimata, solo mentre usi l'app, per rispondere su meteo, luoghi vicini e orari senza chiederti dove sei."
        NSAlarmKitUsageDescription: "I promemoria suonano come una sveglia, anche con il telefono in silenzioso, e puoi posticiparli."
        NSSupportsLiveActivities: true
        NSLocalNetworkUsageDescription: "Per raggiungere il tuo server Ernie quando è sulla stessa rete Wi-Fi."
        UIBackgroundModes: [remote-notification]
        # Notifiche di comunicazione dei messaggi in famiglia (nome e iniziali di chi scrive, come Messaggi).
        NSUserActivityTypes: [INSendMessageIntent]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
        # Collegamenti dai widget dell'orso: ernie://voice (parla), ernie://chat (scrivi).
        CFBundleURLTypes:
          - CFBundleURLName: com.websdbm.ernie
            CFBundleURLSchemes: [ernie]
    entitlements:
      path: Ernie/Ernie.entitlements
      properties:
        aps-environment: development
        # Gruppo app condiviso con il widget dei promemoria (istantanea JSON).
        com.apple.security.application-groups: [group.com.websdbm.ernie]
        # Credenziali nel Keychain condiviso con il foglio «Condividi con Ernie» (vedi Keychain.swift).
        keychain-access-groups: ["$(AppIdentifierPrefix)com.websdbm.ernie"]
        # Messaggi in famiglia ben evidenti sul blocco: urgenti (restano in cima, passano i Full immersion) e
        # notifiche di comunicazione (richiesta dell'utente, 15 ott 2026).
        com.apple.developer.usernotifications.time-sensitive: true
        com.apple.developer.usernotifications.communication: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.websdbm.ernie
        PRODUCT_NAME: Ernie
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  ErnieWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: ErnieWidgets
      - path: Shared
      # Credenziali dal Keychain condiviso: il widget grande chiede il riepilogo al server (GET /v1/widget).
      - path: Ernie/Core/Keychain.swift
      - path: Ernie/Core/Credentials.swift
    info:
      path: ErnieWidgets/Info.plist
      properties:
        CFBundleDisplayName: Widget di Ernie
        CFBundleDevelopmentRegion: it
        CFBundleLocalizations: [it]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: ErnieWidgets/ErnieWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.websdbm.ernie]
        keychain-access-groups: ["$(AppIdentifierPrefix)com.websdbm.ernie"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.websdbm.ernie.widgets
        PRODUCT_NAME: ErnieWidgets
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
  ErnieShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ErnieShare
      # Codice condiviso con l'app: coda delle condivisioni, Keychain (credenziali), tema visivo, modello delle credenziali.
      - path: Shared/ShareInbox.swift
      - path: Ernie/Core/Keychain.swift
      - path: Ernie/Core/Credentials.swift
      - path: Ernie/Design/Theme.swift
    info:
      path: ErnieShare/Info.plist
      properties:
        CFBundleDisplayName: Ernie
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsFileWithMaxCount: 1
    entitlements:
      path: ErnieShare/ErnieShare.entitlements
      properties:
        com.apple.security.application-groups: [group.com.websdbm.ernie]
        keychain-access-groups: ["$(AppIdentifierPrefix)com.websdbm.ernie"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.websdbm.ernie.share
        PRODUCT_NAME: ErnieShare
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
  ErnieNotifications:
    type: app-extension
    platform: iOS
    sources:
      - path: ErnieNotifications
      # Foto del messaggio con le credenziali del Keychain condiviso (niente gruppo app: il portale non lo assegna
      # con la chiave API; il widget rilegge l'ultimo messaggio dal server).
      - path: Ernie/Core/Keychain.swift
      - path: Ernie/Core/Credentials.swift
      - path: Shared/ReminderSnapshot.swift
      - path: Shared/FamilyLatest.swift
    info:
      path: ErnieNotifications/Info.plist
      properties:
        CFBundleDisplayName: Notifiche di Ernie
        CFBundleDevelopmentRegion: it
        CFBundleLocalizations: [it]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: ErnieNotifications/ErnieNotifications.entitlements
      properties:
        keychain-access-groups: ["$(AppIdentifierPrefix)com.websdbm.ernie"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.websdbm.ernie.notifications
        PRODUCT_NAME: ErnieNotifications
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
  ErnieTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ErnieTests
    dependencies:
      - target: Ernie
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.websdbm.ernie.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Ernie:
    build:
      targets:
        Ernie: all
        ErnieWidgets: all
        ErnieShare: all
        ErnieNotifications: all
        ErnieTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [ErnieTests]
