name: Ernie
options:
  bundleIdPrefix: com.websdbm
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    # Team Apple di Alessandro (firma automatica); le build per simulatore non lo richiedono.
    DEVELOPMENT_TEAM: 76X78MBPR3
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  Ernie:
    type: application
    platform: iOS
    sources:
      - path: Ernie
      - path: Shared
    dependencies:
      - target: ErnieWidgets
        embed: true
    info:
      path: Ernie/Info.plist
      properties:
        CFBundleDisplayName: Ernie
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: it
        CFBundleLocalizations: [it]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSMicrophoneUsageDescription: "Ernie ascolta la tua voce quando tocchi il microfono; nella conversazione continua resta in ascolto finché non chiudi."
        NSSpeechRecognitionUsageDescription: "La trascrizione avviene sul dispositivo; al tuo server Ernie arriva solo il testo."
        NSFaceIDUsageDescription: "Conferma delle azioni sensibili: approvazioni e interruttore di emergenza."
        NSCameraUsageDescription: "Per scansionare documenti con la fotocamera: il testo viene letto sul telefono, l'immagine non viene conservata."
        NSPhotoLibraryAddUsageDescription: "Per salvare nella galleria gli schemi e i riassunti che esporti."
        NSAlarmKitUsageDescription: "I promemoria suonano come una sveglia, anche con il telefono in silenzioso, e puoi posticiparli."
        NSSupportsLiveActivities: true
        NSLocalNetworkUsageDescription: "Per raggiungere il tuo server Ernie quando è sulla stessa rete Wi-Fi."
        UIBackgroundModes: [remote-notification]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Ernie/Ernie.entitlements
      properties:
        aps-environment: development
        # Gruppo app condiviso con il widget dei promemoria (istantanea JSON).
        com.apple.security.application-groups: [group.com.websdbm.ernie]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.websdbm.ernie
        PRODUCT_NAME: Ernie
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  ErnieWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: ErnieWidgets
      - path: Shared
    info:
      path: ErnieWidgets/Info.plist
      properties:
        CFBundleDisplayName: Promemoria di Ernie
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: ErnieWidgets/ErnieWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.websdbm.ernie]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.websdbm.ernie.widgets
        PRODUCT_NAME: ErnieWidgets
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
  ErnieTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ErnieTests
    dependencies:
      - target: Ernie
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.websdbm.ernie.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Ernie:
    build:
      targets:
        Ernie: all
        ErnieWidgets: all
        ErnieTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [ErnieTests]
