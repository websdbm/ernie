name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'apps/ios/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'apps/ios/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ernie
          POSTGRES_PASSWORD: ernie
          POSTGRES_DB: ernie
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ernie -d ernie"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      CI: "true"
      # Application tests must use the restricted role; the owner bypasses RLS.
      DATABASE_URL: postgres://ernie_app:ernie_app@localhost:5432/ernie
      MIGRATIONS_DATABASE_URL: postgres://ernie:ernie@localhost:5432/ernie
      APP_DB_PASSWORD: ernie_app
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audio processing dependency
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm migrate up
      - run: pnpm bootstrap:storage
      - run: pnpm test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-report
          path: reports/
          if-no-files-found: ignore

  docker:
    name: docker build · compose · smoke
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        run: docker compose build
      - name: Start stack
        run: docker compose up -d --wait api worker
      - name: Smoke test
        run: tests/smoke.sh http://localhost:3000
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
