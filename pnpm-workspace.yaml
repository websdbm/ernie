packages:
  - apps/*
  - packages/*
  - tests

# Dipendenze autorizzate a eseguire script di build (binari nativi/opzionali).
allowBuilds:
  cpu-features: false
  esbuild: true
  msgpackr-extract: true
  ssh2: false

minimumReleaseAgeExclude:
  - '@ai-sdk/anthropic@4.0.79'
  - '@ai-sdk/provider-utils@5.0.59'
  - '@ai-sdk/provider@4.0.27'
